
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocket Signal Pro - Demo Login</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d18;color:white;
 font-family:Arial,sans-serif;
 display:flex;justify-content:center;align-items:center;
 min-height:100vh;padding:20px;
}
.panel{
 width:100%;max-width:400px;
 background:#111b2e;border:1px solid #263955;
 border-radius:18px;padding:28px;text-align:center;
}
h1{color:#35d9ff;font-size:25px}
.subtitle{color:#9aabc5;margin-bottom:25px}
label{display:block;text-align:left;color:#9aabc5;margin:15px 0 7px}
input{
 width:100%;padding:14px;border-radius:9px;
 border:1px solid #263955;background:#080d18;
 color:white;font-size:15px;
}
button{
 width:100%;padding:15px;margin-top:20px;
 border:0;border-radius:10px;background:#16b9e8;
 color:#06111e;font-size:16px;font-weight:bold;
 cursor:pointer;
}
.notice{font-size:12px;color:#aab7ca;line-height:1.6;margin-top:20px}
a{color:#35d9ff}
</style>
</head>
<body>
<div class="panel">
 <h1>🚀 ROCKET SIGNAL PRO</h1>
 <div class="subtitle">Educational Demo Login</div>

 <form onsubmit="event.preventDefault(); demoLogin();">
  <label for="username">Demo Username</label>
  <input id="username" type="text" placeholder="Enter demo username" required>

  <label for="password">Demo Password</label>
  <input id="password" type="password" placeholder="Enter any demo text" required>

  <button type="submit">OPEN DEMO</button>
 </form>

 <p id="message" class="notice">
  Demo only. Do not enter a real password.
 </p>

 <div class="notice">
  This page does not create or verify real accounts.
 </div>
</div>

<script>
function demoLogin(){
 const username=document.getElementById("username").value.trim();
 if(!username)return;

 document.getElementById("message").innerHTML=
  "Welcome, "+username+"!<br><br>"+
  '<a href="dashboard.html">Open Demo Dashboard</a>';
}
</script>
</body>
</html>
